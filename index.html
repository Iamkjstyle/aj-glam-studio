<!doctype html><html lang="hi"><head><meta charset="utf-8"><title>AJ Glam Studio</title><meta name="theme-color" content="#ffdfe9"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>AJ Glam Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Pacifico&display=swap">
<style>
/* Layout: one phone-shaped stage (max 480px) centred on a blush backdrop; a bulb-lit vanity mirror holds the character, the tool tray docks under it. Single deliberate pastel look. */
:root{
  --bg:#ffdfe9; --bg2:#fff3e2; --ink:#47203c; --soft:#8b6280; --card:#fffaf7; --line:#f5d5e0;
  --rose:#ff5c8d; --rose2:#d93a72; --gold:#f0b232; --plum:#5d2350; --mint:#3fb59e;
  --logo:"Pacifico","Brush Script MT",cursive;
  --ui:"Fredoka","Trebuchet MS","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:linear-gradient(160deg,var(--bg),var(--bg2));color:var(--ink);font-family:var(--ui);font-size:15px;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible{outline:3px solid var(--plum);outline-offset:2px}
#app{position:relative;height:100%;max-width:480px;margin:0 auto;overflow:hidden;background:radial-gradient(120% 50% at 50% 0%,#fff7fa 0%,rgba(255,247,250,0) 70%)}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;gap:10px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.pill{display:inline-flex;align-items:center;gap:5px;background:var(--card);border-radius:999px;padding:5px 12px;font-weight:600;font-variant-numeric:tabular-nums;box-shadow:0 2px 0 var(--line)}
.pill small{font-size:10px;color:var(--soft);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.coin{display:inline-block;width:1em;height:1em;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe9a3,#f0b232 60%,#c98a12);box-shadow:inset 0 0 0 2px #d99a1b;vertical-align:-.12em;margin-right:2px}
.icon-btn{width:38px;height:38px;border-radius:50%;background:var(--card);box-shadow:0 2px 0 var(--line);font-size:17px;display:grid;place-items:center;flex:0 0 auto}
.btn{background:linear-gradient(#ff7aa3,var(--rose));color:#fff;font-weight:700;font-size:16px;border-radius:999px;padding:12px 20px;box-shadow:0 4px 0 var(--rose2);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--rose2)}
.btn.ghost{background:var(--card);color:var(--rose2);box-shadow:0 4px 0 var(--line)}

/* ---------- home ---------- */
#home{overflow-y:auto;gap:12px}
.top{display:flex;gap:8px;align-items:center}
.top .sp{flex:1}
.hero{text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.logo{font-family:var(--logo);font-size:42px;line-height:1.15;color:var(--rose2);text-shadow:0 2px 0 #fff,0 5px 0 rgba(217,58,114,.18)}
.tag{margin:0;color:var(--soft);font-weight:500}
.polaroid{background:#fff;padding:9px 9px 6px;border-radius:6px;box-shadow:0 10px 22px rgba(93,35,80,.22);transform:rotate(-2deg);width:min(100%,330px);margin:10px auto 4px}
.polaroid svg{display:block;width:100%;aspect-ratio:4/3;border-radius:3px}
.polaroid .cap{font-family:var(--logo);text-align:center;font-size:17px;color:var(--plum);padding-top:4px}
h2{font-size:17px;margin:6px 0 0;font-weight:700}
.levels{display:flex;flex-direction:column;gap:9px;padding-bottom:14px}
.lv{display:flex;align-items:center;gap:12px;text-align:left;background:var(--card);border-radius:20px;padding:10px 12px;box-shadow:0 3px 0 var(--line)}
.lv:active{transform:translateY(2px)}
.lv-ic{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:27px;flex:0 0 auto}
.lv-mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.lv-mid b{font-size:16px}
.lv-mid small{color:var(--soft);font-size:12px}
.lv-st{color:var(--gold);font-size:15px;letter-spacing:2px}
.lv-st i{font-style:normal;color:#ead9df}
.lv-go{width:36px;height:36px;border-radius:50%;background:var(--rose);color:#fff;display:grid;place-items:center;font-size:13px;flex:0 0 auto}
.lv.locked{opacity:.6}
.lv.locked .lv-go{background:#e7d3db}

/* ---------- play ---------- */
.hud{display:flex;align-items:center;gap:8px}
.hud-mid{flex:1;min-width:0}
#lvName{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.steps{display:flex;gap:4px;margin-top:2px}
.steps span{font-size:10px;font-weight:600;padding:1px 7px;border-radius:999px;background:#f6dce5;color:var(--soft)}
.steps em{font-style:normal;font-size:10px;font-weight:700;color:var(--rose2);margin-left:auto;white-space:nowrap}
.steps span.on{background:var(--plum);color:#fff}
.steps span.done{background:var(--mint);color:#fff}
.guide{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:18px;padding:8px 12px;box-shadow:0 2px 0 var(--line)}
#guideIcon{font-size:24px;width:30px;text-align:center;flex:0 0 auto}
.guide-txt{flex:1;min-width:0}
#guideText{font-weight:600;font-size:14px;line-height:1.25}
.bar{height:7px;border-radius:999px;background:#f6dce5;margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,var(--gold),var(--rose));transition:width .15s}
.stagewrap{flex:1;min-height:0;display:grid;place-items:center;container-type:size}
.mirror{position:relative;width:min(100cqw,calc(100cqh*.8));aspect-ratio:4/5;border-radius:26px;padding:15px 12px;
  background:
   radial-gradient(circle,#fff6c9 0 3px,#f0b232 3.5px 4.6px,rgba(240,178,50,0) 5.2px) 50% 3px/24px 10px repeat-x,
   radial-gradient(circle,#fff6c9 0 3px,#f0b232 3.5px 4.6px,rgba(240,178,50,0) 5.2px) 50% calc(100% - 3px)/24px 10px repeat-x,
   var(--plum);
  box-shadow:0 10px 24px rgba(93,35,80,.28)}
#face{position:relative;width:100%;height:100%;border-radius:16px;overflow:hidden;background:radial-gradient(circle at 50% 36%,#ffffff 0%,#ffeaf2 55%,#f8cfe0 100%);touch-action:none}
#face svg{display:block;width:100%;height:100%;pointer-events:none}
#tool{position:absolute;left:0;top:0;width:46px;height:46px;margin:-58px 0 0 -23px;border-radius:50%;background:#fff;box-shadow:0 4px 10px rgba(93,35,80,.3);display:grid;place-items:center;font-size:24px;pointer-events:none;z-index:3}
#fx{position:absolute;inset:0;pointer-events:none;overflow:hidden;border-radius:26px;z-index:4}
.spark{position:absolute;color:var(--gold);font-size:16px;animation:spark .6s ease-out forwards}
@keyframes spark{from{opacity:1;transform:translate(-50%,-50%) scale(.4)}to{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.3) rotate(90deg)}}
.pop{position:absolute;left:50%;top:15%;transform:translate(-50%,-50%);white-space:nowrap;font-weight:700;font-size:20px;color:#fff;background:var(--plum);padding:6px 16px;border-radius:999px;box-shadow:0 4px 0 rgba(0,0,0,.18);animation:pop 1.1s ease-out forwards}
.pop.love{background:var(--rose)}
.pop.meh{background:#9a8492}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-20%) scale(.6)}18%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}70%{opacity:1;transform:translate(-50%,-70%) scale(1)}100%{opacity:0;transform:translate(-50%,-110%) scale(.96)}}
.hint{animation:hint 1s ease-in-out infinite alternate}
@keyframes hint{from{opacity:.25}to{opacity:.9}}
.tray{background:var(--card);border-radius:22px;padding:10px;box-shadow:0 -2px 14px rgba(93,35,80,.1);display:flex;flex-direction:column;gap:8px}
.tabs,.opts{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar,.opts::-webkit-scrollbar{display:none}
.tab{position:relative;flex:1 1 0;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0;padding:5px 2px;border-radius:14px;font-size:10.5px;white-space:nowrap;font-weight:600;color:var(--soft);background:#fdecf2}
.tab i{font-style:normal;font-size:20px;line-height:1.2}
.tab.on{background:var(--rose);color:#fff}
.tab.done::after{content:"✓";position:absolute;top:-3px;right:-2px;width:16px;height:16px;border-radius:50%;background:var(--mint);color:#fff;font-size:10px;display:grid;place-items:center}
.tab.spa{cursor:default;flex:1 0 auto;min-width:56px;padding-inline:6px}
.tab.spa.cur{background:var(--plum);color:#fff}
.opts{padding:3px 2px 2px;min-height:84px}
.opt{position:relative;flex:0 0 auto;width:64px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;line-height:1.1;text-align:center}
.opt .th{width:58px;height:58px;border-radius:16px;background:#fff;border:2.5px solid var(--line);overflow:hidden;display:grid;place-items:center;font-size:22px;color:var(--soft)}
.opt .th svg{width:100%;height:100%;display:block}
.opt.on .th{border-color:var(--rose);box-shadow:0 0 0 3px #ffc6d8}
.sw{width:40px;height:40px;border-radius:50%;box-shadow:inset -4px -5px 0 rgba(0,0,0,.13),inset 3px 4px 0 rgba(255,255,255,.4)}
.lock{position:absolute;top:-3px;right:-2px;background:var(--plum);color:#fff;font-size:10px;border-radius:999px;padding:1px 6px;z-index:1}
#nextBtn{align-self:stretch}

/* ---------- result ---------- */
#result{overflow-y:auto;align-items:center;gap:8px}
.stars{display:flex;gap:6px;font-size:44px;line-height:1;color:#ead9df}
.stars span{transition:transform .3s,color .3s}
.stars span.lit{color:var(--gold);transform:scale(1.2) rotate(-8deg);text-shadow:0 3px 0 #c98a12}
.total{display:flex;align-items:baseline;gap:8px}
.total b{font-size:40px;font-weight:700;color:var(--rose2);font-variant-numeric:tabular-nums}
.total span,.total em{font-size:12px;font-weight:600;color:var(--soft);font-style:normal;text-transform:uppercase;letter-spacing:.06em}
.total em{color:var(--mint)}
.rows{width:100%;background:var(--card);border-radius:18px;padding:10px 14px;display:flex;flex-direction:column;gap:7px;box-shadow:0 2px 0 var(--line)}
.row{display:grid;grid-template-columns:86px 1fr 64px;align-items:center;gap:8px;font-size:13px;font-weight:600}
.row .bar{margin:0}
.row b{text-align:right;font-variant-numeric:tabular-nums}
.bubble{width:100%;display:flex;gap:10px;align-items:center;background:#fff;border-radius:18px;padding:8px 12px;box-shadow:0 2px 0 var(--line);font-weight:500;line-height:1.3}
.bubble svg{width:54px;height:54px;flex:0 0 auto;border-radius:50%;background:#ffe3ec}
.note{width:100%;background:#fff6d9;border:2px dashed var(--gold);border-radius:16px;padding:9px 12px;font-size:14px;line-height:1.35}
.note b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:#a8760a}
.res-btns{width:100%;display:flex;gap:8px;padding-bottom:10px}
.res-btns .btn{flex:1;padding-inline:8px}
.conf{position:absolute;top:-30px;font-size:20px;animation:fall linear forwards;pointer-events:none;z-index:5}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}

/* ---------- sheet + toast ---------- */
.sheet{position:absolute;inset:0;background:rgba(71,32,60,.55);display:flex;align-items:flex-end;z-index:20}
.sheet-card{width:100%;background:var(--card);border-radius:26px 26px 0 0;padding:18px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40%);opacity:0}}
.sheet-card h3{margin:0;font-size:19px}
.sheet-card p{margin:0;line-height:1.4}
.brief{display:flex;gap:12px;align-items:flex-start}
.brief svg{width:84px;height:96px;flex:0 0 auto;border-radius:18px;background:#ffe3ec}
.say{background:#fff;border-radius:4px 18px 18px 18px;padding:10px 12px;box-shadow:0 2px 0 var(--line);font-weight:500;line-height:1.35}
.say b{display:block;font-size:11px;color:var(--rose2);text-transform:uppercase;letter-spacing:.07em}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px;font-weight:600;color:var(--soft)}
.chip{background:var(--plum);color:#fff;border-radius:999px;padding:2px 10px;font-size:12px}
.sheet-btns{display:flex;gap:8px}
.sheet-btns .btn{flex:1}
#toast{position:absolute;left:50%;bottom:120px;transform:translateX(-50%);background:var(--plum);color:#fff;font-weight:600;padding:8px 16px;border-radius:999px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;text-align:center}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition:none!important}}
</style>

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
/* ================= data ================= */
const VN={cute:'Cute',casual:'Casual',desi:'Desi',glam:'Glam'};
const CAT={
 base:[{id:'dewy',name:'Dewy Glow',c:'#ffe1cc',v:['cute','casual','glam']},{id:'matte',name:'Soft Matte',c:'#efc4a4',v:['casual','desi']},{id:'gold',name:'Golden Glow',c:'#f6cf86',v:['desi','glam']}],
 blush:[{id:'rose',name:'Rose Pink',c:'#ff8fab',v:['cute']},{id:'peach',name:'Peach',c:'#ffa98a',v:['casual','cute']},{id:'coral',name:'Coral',c:'#ff7868',v:['desi','casual']},{id:'berry',name:'Berry',c:'#d4567f',v:['glam','desi']},{id:'bronze',name:'Bronze',c:'#c58860',v:['glam']}],

$('#muteBtn').addEventListener('click',()=>{P.mute=!P.mute;save();$('#muteBtn').textContent=P.mute?'🔇':'🔊';sfx.tap()});
function brief(i){const l=LV[i];
 openSheet(`<h3>${l.e} ${l.name}</h3><div class="brief"><svg viewBox="80 50 240 274">${kjInner({shirt:l.kj,mood:'happy'})}</svg><div class="say"><b>Kaju ki farmaish</b>${l.ask}</div></div><div class="chips">Aaj ka mood: ${l.free?'<span class="chip">Jo dil kare</span>':l.v.map(v=>`<span class="chip">${VN[v]}</span>`).join('')}</div><p style="font-size:13px;color:var(--soft)">Pehle spa, phir makeup, phir outfit. Farmaish se match karoge to score zyada, aur jaldi karoge to speed bonus.</p><div class="sheet-btns"><button class="btn ghost" data-a="close">Baad me</button><button class="btn" data-a="go">Ready ho jao</button></div>`);
 $('#sheet').onclick=e=>{const a=e.target.dataset.a;if(a==='close'||e.target.id==='sheet'){closeSheet()}if(a==='go'){closeSheet();startLevel(i)}};
}

/* ================= game flow ================= */
function mkCells(){const c=[];for(let y=128;y<=284;y+=19)for(let x=124;x<=276;x+=19)if(((x-200)/83)**2+((y-204)/87)**2<=1)c.push({x,y,on:false});return c}
function startLevel(i){
 G={i,lv:LV[i],stage:'spa',spa:0,L:newLook(),t0:performance.now(),spaPts:0,miss:0,stepT:0,cells:mkCells(),kind:'foam',cuc:false,busy:false,tab:null,down:false,last:null,done:{}};
 $('#lvName').textContent=G.lv.e+' '+G.lv.name;$('#mood').textContent='♥ '+(G.lv.free?'Jo dil kare':G.lv.v.map(v=>VN[v]).join(' + '));
 show('play');fx.innerHTML='';enterSpa(0);clearInterval(timer);timer=setInterval(tick,200);tick();
}
function tick(){if(!G)return;const s=Math.floor((performance.now()-G.t0)/1000);$('#time').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
 if(G.stage==='spa'&&SPA[G.spa].mode==='wait'&&!G.busy){const f=(performance.now()-G.stepT)/SPA[G.spa].dur;$('#guideBar').style.width=Math.min(100,f*100)+'%';if(f>=1)spaDone()}}
function setStage(){document.querySelectorAll('#steps span').forEach(s=>{const o=['spa','makeup','style'],k=o.indexOf(s.dataset.s),c=o.indexOf(G.stage);s.className=k<c?'done':k===c?'on':''})}
function enterSpa(k){G.spa=k;G.busy=false;G.miss=0;G.stepT=performance.now();const st=SPA[k],L=G.L;
 if(st.id==='foam'){G.kind='foam';G.cells.forEach(c=>c.on=false);L.closed=true}
 if(st.id==='spots')L.closed=false;
 if(st.id==='mask'){G.kind='mask';G.cells.forEach(c=>c.on=false);L.closed=true}
 if(st.id==='relax')G.cuc=true;
 if(st.id==='peel')G.cuc=false;
 if(st.id==='brows'){L.closed=false;G.kind=''}
 toolEl.innerHTML=st.id==='mask'?'🖌️':st.icon;setStage();renderTray();setGuide();draw()}
function spaProg(){const st=SPA[G.spa],on=G.cells.filter(c=>c.on).length/G.cells.length;
 if(st.mode==='cover')return on;if(st.mode==='clear')return 1-on;
 if(st.id==='spots')return G.L.spots.filter(Boolean).length/5;if(st.id==='brows')return G.L.strays.filter(Boolean).length/6;return 0}
function spaDone(){if(G.busy)return;G.busy=true;const st=SPA[G.spa];
 if(st.par){const t=(performance.now()-G.stepT)/1000,pts=Math.max(22,50-Math.max(0,Math.round((t-st.par)*3))-G.miss*4);G.spaPts+=pts;pop((pts>=46?'Perfect! ':pts>=36?'Bahut badhiya! ':'Nice! ')+'+'+pts);sfx.good()}
 draw();
 setTimeout(()=>{if(!G||G.stage!=='spa')return;if(G.spa<SPA.length-1)enterSpa(G.spa+1);else{G.L.clean=1;G.L.closed=false;pop('Skin glow ✨','love');sfx.win();draw();setTimeout(()=>G&&enterStage('makeup'),1000)}},700)}
function enterStage(s){G.stage=s;G.busy=false;G.kind='';G.L.band=false;G.tab=TABS[s][0];setStage();renderTray();setGuide();draw();pop(s==='makeup'?'Makeup time 💄':'Ab style karo 👗','love')}
const matches=it=>G.lv.v.some(v=>it.v.includes(v));
function slotDone(s){const L=G.L;return RUB.includes(s)?!!(L[s].id&&L[s].amt>=1):!!(L[s]&&L[s]!=='none'&&L[s]!=='robe'&&(s!=='hair'||G.done.hair))}
function calc(){const L=G.L;
 const rub=(s,max)=>{const x=L[s];return x.id?Math.round(max*x.amt*(matches(item(s,x.id))?1:.5)):0};
 const tap=(s,max)=>{const id=L[s];if(!id||id==='none'||id==='robe')return 0;return Math.round(max*(matches(item(s,id))?1:.4))};
 return{spa:Math.min(300,G.spaPts),makeup:rub('base',50)+rub('blush',50)+rub('shadow',55)+tap('liner',45)+tap('lashes',40)+rub('lips',60),style:tap('outfit',110)+(G.done.hair?tap('hair',60):0)+tap('ear',45)+tap('neck',35)+tap('bindi',20)+tap('extra',30)}}
function setGuide(){let ic,tx;if(G.stage==='spa'){const st=SPA[G.spa];ic=st.icon;tx=st.text}else{const s=G.tab,L=G.L;ic=TAB[s][0];tx=TIP[s];if(RUB.includes(s)&&L[s].id&&L[s].amt<1)tx={base:'Ab poore chehre pe ragdo',blush:'Ab dono gaalon pe brush ghumao',shadow:'Ab palkon pe brush chalao',lips:'Ab honthon pe lipstick lagao'}[s]}
 $('#guideIcon').innerHTML=ic;$('#guideText').textContent=tx}

/* ================= tray ================= */
const THUMB={hair:'40 36 320 320',outfit:'70 248 260 238',ear:'80 186 70 70',neck:'150 272 100 100',bindi:'165 128 70 70',extra:'112 52 176 176',liner:'124 164 76 62',lashes:'124 164 76 62'};
function thumb(slot,id){const L=demoLook({base:{id:null,amt:0},blush:{id:null,amt:0},shadow:{id:null,amt:0},lips:{id:null,amt:0},liner:'none',lashes:'none',outfit:'tee',ear:'none',neck:'none',extra:'none',hair:slot==='ear'?'bun':'open'});
 if(slot==='neck')L.outfit='shimmer';L[slot]=id;return ajSVG(L,THUMB[slot])}
function renderTray(){const tabs=$('#tabs'),opts=$('#opts'),nb=$('#nextBtn');
 if(G.stage==='spa'){tabs.innerHTML=SPA.map((s,k)=>`<span class="tab spa ${k<G.spa?'done':k===G.spa?'cur':''}"><i>${s.icon}</i>${s.lab}</span>`).join('');opts.hidden=true;nb.hidden=true;const c=tabs.querySelector('.cur');if(c&&c.scrollIntoView)tabs.scrollLeft=Math.max(0,c.offsetLeft-tabs.clientWidth/2+30);return}
 opts.hidden=false;nb.hidden=false;tabs.scrollLeft=0;nb.textContent=G.stage==='makeup'?'Makeup ho gaya, ab style ➜':'Photo time 📸';
 tabs.innerHTML=TABS[G.stage].map(s=>`<button class="tab ${s===G.tab?'on':''} ${slotDone(s)?'done':''}" data-s="${s}"><i>${TAB[s][0]}</i>${TAB[s][1]}</button>`).join('');
 renderOpts()}
function renderOpts(){const s=G.tab,L=G.L,cur=RUB.includes(s)?L[s].id:L[s];let h='';
 if(!RUB.includes(s)&&s!=='hair'&&s!=='outfit')h+=`<button class="opt ${cur==='none'?'on':''}" data-id="none"><span class="th">✕</span>Kuch nahi</button>`;
 for(const it of CAT[s]){const locked=it.cost&&!P.owned[s+':'+it.id];
  h+=`<button class="opt ${cur===it.id?'on':''}" data-id="${it.id}">${locked?`<span class="lock"><i class="coin"></i>${it.cost}</span>`:''}<span class="th">${it.c?`<span class="sw" style="background:${it.c}"></span>`:thumb(s,it.id)}</span>${it.name}</button>`}
 $('#opts').innerHTML=h;$('#opts').scrollLeft=0;toolEl.innerHTML=TOOL[s]||''}
function updTabs(){document.querySelectorAll('#tabs .tab[data-s]').forEach(t=>t.classList.toggle('done',slotDone(t.dataset.s)))}
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('.tab[data-s]');if(!b||!G||G.stage==='spa')return;G.tab=b.dataset.s;sfx.tap();renderTray();setGuide();draw()});
$('#opts').addEventListener('click',e=>{const b=e.target.closest('.opt');if(!b||!G)return;const s=G.tab,id=b.dataset.id,L=G.L;
 if(id!=='none'){const it=item(s,id);if(it.cost&&!P.owned[s+':'+id]){buy(s,it);return}}
 sfx.tap();
 if(RUB.includes(s)){L[s].id=id;if(L[s].amt>=1)react(item(s,id))}
 else{L[s]=id;if(s==='hair')G.done.hair=true;if(id!=='none')react(item(s,id))}
 renderOpts();updTabs();setGuide();draw()});
function react(it){if(G.lv.free||matches(it)){pop('Kaju ko pasand! 💗','love');sfx.good()}else pop('Hmm, theek hai 🙂','meh')}
function buy(s,it){const can=P.coins>=it.cost;
 openSheet(`<h3>${it.name} kholna hai?</h3><p>${can?`Iske liye <i class="coin"></i> ${it.cost} lagenge. Tumhare paas <i class="coin"></i> ${P.coins} hain.`:`Iske liye <i class="coin"></i> ${it.cost} chahiye, tumhare paas abhi <i class="coin"></i> ${P.coins} hain. Level khelo aur coins kamao.`}</p><div class="sheet-btns"><button class="btn ghost" data-a="close">${can?'Nahi':'Theek hai'}</button>${can?'<button class="btn" data-a="buy">Khol do</button>':''}</div>`);
 $('#sheet').onclick=e=>{const a=e.target.dataset.a;if(a==='close'||e.target.id==='sheet')closeSheet();if(a==='buy'){P.coins-=it.cost;P.owned[s+':'+it.id]=1;save();sfx.coin();closeSheet();G.L[s]=it.id;if(s==='hair')G.done.hair=true;react(it);renderOpts();updTabs();draw()}}}
$('#nextBtn').addEventListener('click',()=>{if(!G||G.busy)return;
 if(G.stage==='makeup'){if(!TABS.makeup.some(slotDone)){toast('Thoda makeup to karo, Pisti!');sfx.bad();return}sfx.tap();enterStage('style')}
 else if(G.stage==='style'){if(G.L.outfit==='robe'){toast('Outfit to pehno, AJ!');sfx.bad();G.tab='outfit';renderTray();setGuide();return}finish()}});
$('#quitBtn').addEventListener('click',()=>{sfx.tap();openSheet(`<h3>Level chhodna hai?</h3><p>Is level ka score save nahi hoga.</p><div class="sheet-btns"><button class="btn ghost" data-a="quit">Home jao</button><button class="btn" data-a="close">Khelte raho</button></div>`);
 $('#sheet').onclick=e=>{const a=e.target.dataset.a;if(a==='close'||e.target.id==='sheet')closeSheet();if(a==='quit'){closeSheet();goHome()}}});
function goHome(){clearInterval(timer);G=null;renderHome();show('home')}

/* ================= drawing + input ================= */
const viewBox=()=>G.stage==='style'?[6,0,388.8,486]:[70,72,260,325];
let rq=0;function draw(){if(!rq)rq=requestAnimationFrame(()=>{rq=0;paint()})}
function paint(){if(!G)return;const L=G.L;let mid='',over='';
 if(G.stage==='spa'){const st=SPA[G.spa];
  if(G.kind==='mask')mid+=`<g clip-path="url(#cF)">${G.cells.filter(c=>c.on).map(c=>`<circle cx="${c.x}" cy="${c.y}" r="17" fill="#e8c45e"/>`).join('')}</g>`;
  if(G.kind==='foam')over+=G.cells.map((c,i)=>c.on?`<circle cx="${c.x}" cy="${c.y}" r="${15+i%3*2}" fill="#fff" opacity=".94"/>${i%4===0?`<circle cx="${c.x+5}" cy="${c.y-4}" r="6" fill="none" stroke="#cfe9f7" stroke-width="1.5"/>`:''}`:'').join('');
  if(G.cuc)over+=[162,238].map(x=>`<circle cx="${x}" cy="200" r="26" fill="#bfe39a" stroke="#7fb85a" stroke-width="4"/><circle cx="${x}" cy="200" r="11" fill="#d9f0bd"/>`).join('');
  if(!G.down&&!G.busy){
   if(st.mode==='cover')over+=`<path class="hint" d="${FACE}" fill="none" stroke="#ff5c8d" stroke-width="3" stroke-dasharray="7 7"/>`;
   if(st.id==='spots')over+=SPOTS.map((p,i)=>L.spots[i]?'':`<circle class="hint" cx="${p[0]}" cy="${p[1]}" r="13" fill="none" stroke="#ff5c8d" stroke-width="2.5"/>`).join('');
   if(st.id==='brows')over+=STRAYS.map((p,i)=>L.strays[i]?'':`<circle class="hint" cx="${p[0]}" cy="${p[1]-3}" r="9" fill="none" stroke="#ff5c8d" stroke-width="2"/>`).join('')}
  $('#guideBar').style.width=(st.mode==='wait'?0:spaProg()*100)+'%';
 }else{const s=G.tab;
  if(RUB.includes(s)&&L[s].id&&L[s].amt<1&&!G.down){const sh={base:`<path d="${FACE}"/>`,blush:'<circle cx="146" cy="232" r="27"/><circle cx="254" cy="232" r="27"/>',shadow:'<ellipse cx="162" cy="187" rx="30" ry="18"/><ellipse cx="238" cy="187" rx="30" ry="18"/>',lips:'<ellipse cx="200" cy="256" rx="31" ry="17"/>'}[s];over+=`<g class="hint" fill="rgba(255,92,141,.1)" stroke="#ff5c8d" stroke-width="2.5" stroke-dasharray="6 6">${sh}</g>`}
  const all=TABS[G.stage];$('#guideBar').style.width=(RUB.includes(s)&&L[s].id&&L[s].amt<1?L[s].amt:all.filter(slotDone).length/all.length)*100+'%';
 }
 face.innerHTML=ajSVG(L,viewBox().join(' '),{mid,over});
 const c=calc();$('#score').textContent=c.spa+c.makeup+c.style}
function pt(e){const r=face.getBoundingClientRect(),v=viewBox(),k=Math.min(r.width/v[2],r.height/v[3]);return{x:v[0]+(e.clientX-r.left-(r.width-v[2]*k)/2)/k,y:v[1]+(e.clientY-r.top-(r.height-v[3]*k)/2)/k}}
function moveTool(e){const m=face.parentElement.getBoundingClientRect();toolEl.style.transform=`translate(${e.clientX-m.left}px,${e.clientY-m.top}px)`}
const REG={base:p=>((p.x-200)/84)**2+((p.y-200)/92)**2<=1,blush:p=>Math.hypot(p.x-148,p.y-232)<38||Math.hypot(p.x-252,p.y-232)<38,shadow:p=>Math.abs(p.y-190)<30&&(Math.abs(p.x-162)<36||Math.abs(p.x-238)<36),lips:p=>Math.abs(p.x-200)<38&&Math.abs(p.y-256)<24};
const NEED={base:620,blush:230,shadow:190,lips:130};
function act(p,isDown,d,e){if(!G||G.busy)return;const L=G.L;
 if(G.stage==='spa'){const st=SPA[G.spa];
  if(st.mode==='cover'||st.mode==='clear'){const want=st.mode==='cover';let ch=0;for(const c of G.cells)if(c.on!==want&&Math.hypot(c.x-p.x,c.y-p.y)<31){c.on=want;ch++}
   if(ch){sfx.rub();spark(e)}const f=spaProg();if(f>=.93){G.cells.forEach(c=>c.on=want);spaDone()}draw()}
  else if(st.mode==='tap'&&isDown){const pts=st.id==='spots'?SPOTS:STRAYS,arr=st.id==='spots'?L.spots:L.strays,rad=st.id==='spots'?26:20;let best=-1,bd=rad;
   pts.forEach((q,i)=>{if(arr[i])return;const dd=Math.hypot(q[0]-p.x,q[1]-p.y);if(dd<bd){bd=dd;best=i}});
   if(best>=0){arr[best]=1;sfx.tap();spark(e,true);if(arr.every(Boolean))spaDone()}else{G.miss++;sfx.bad()}draw()}
  return}
 const s=G.tab;if(!RUB.includes(s))return;
 if(!L[s].id){if(isDown){toast('Pehle neeche se shade chuno');sfx.bad()}return}
 if(L[s].amt>=1||!REG[s](p))return;
 L[s].amt=Math.min(1,L[s].amt+(isDown?.05:d/NEED[s]));sfx.rub();spark(e);
 if(L[s].amt>=1){G.down=false;toolEl.hidden=true;react(item(s,L[s].id));updTabs();setGuide()}
 draw()}
face.addEventListener('pointerdown',e=>{if(!G)return;e.preventDefault();try{face.setPointerCapture(e.pointerId)}catch(_){}G.down=true;const p=pt(e);G.last=p;
 const rubbing=G.stage==='spa'?SPA[G.spa].mode!=='wait':RUB.includes(G.tab)&&G.L[G.tab].id&&G.L[G.tab].amt<1;
 if(rubbing){toolEl.hidden=false;moveTool(e)}act(p,true,0,e);draw()});
face.addEventListener('pointermove',e=>{if(!G||!G.down)return;const p=pt(e),d=Math.hypot(p.x-G.last.x,p.y-G.last.y);G.last=p;moveTool(e);act(p,false,d,e)});
const up=()=>{if(!G)return;G.down=false;toolEl.hidden=true;draw()};
face.addEventListener('pointerup',up);face.addEventListener('pointercancel',up);

/* ================= result ================= */
function finish(){clearInterval(timer);const T=(performance.now()-G.t0)/1000,c=calc();
 const time=Math.round(100*Math.max(0,Math.min(1,(480-T)/280)));const total=c.spa+c.makeup+c.style+time;
 const stars=total>=850?3:total>=680?2:1,lv=G.lv,coins=Math.round(total/10)+stars*10;
 const isBest=total>(P.best[lv.id]||0);if(isBest)P.best[lv.id]=total;P.stars[lv.id]=Math.max(P.stars[lv.id]||0,stars);P.coins+=coins;save();
 const mood=stars===3?'love':stars===2?'happy':'smile';
 $('#photo').innerHTML=photoSVG(lv.scene,G.L,{shirt:lv.kj,mood});$('#photoCap').textContent='AJ ♥ KJ · '+lv.name;
 const rows=[['Skin care',c.spa,300],['Makeup',c.makeup,300],['Style',c.style,300],['Speed',time,100]];
 $('#resRows').innerHTML=rows.map(r=>`<div class="row"><span>${r[0]}</span><div class="bar"><i data-w="${r[1]/r[2]*100}"></i></div><b>${r[1]}/${r[2]}</b></div>`).join('')+`<div class="row"><span>Coins</span><span></span><b>+<i class="coin"></i>${coins}</b></div>`;
 $('#resSay').innerHTML=`<svg viewBox="95 70 210 210">${kjInner({shirt:lv.kj,mood})}</svg><span>${SAY[stars]}</span>`;
 const note=$('#resNote');note.hidden=stars<3;note.innerHTML=`<b>💌 Kaju ka love note khul gaya</b>${lv.note}`;
 $('#resBest').textContent=isBest?'New best!':'';
 const nx=$('#nextLvBtn'),last=G.i>=LV.length-1;nx.hidden=last;
 const stEls=[...document.querySelectorAll('#resStars span')];stEls.forEach(s=>s.classList.remove('lit'));
 $('#resTotal').textContent='0';show('result');$('#result').scrollTop=0;
 const i=G.i;G=null;finish.i=i;
 const t0=performance.now();(function cnt(){const k=Math.min(1,(performance.now()-t0)/900);$('#resTotal').textContent=Math.round(total*k);if(k<1)requestAnimationFrame(cnt)})();
 setTimeout(()=>document.querySelectorAll('#resRows .bar i').forEach(b=>b.style.width=b.dataset.w+'%'),60);
 for(let k=0;k<stars;k++)setTimeout(()=>{stEls[k].classList.add('lit');sfx.star(k)},500+k*380);
 setTimeout(()=>{sfx.win();confetti(stars)},500+stars*380)}
function confetti(n){const host=$('#result');for(let i=0;i<n*10;i++){const e=document.createElement('span');e.className='conf';e.textContent=['💗','✨','💖','⭐'][i%4];e.style.left=Math.random()*94+'%';e.style.animationDuration=(2+Math.random()*2)+'s';e.style.animationDelay=Math.random()*.8+'s';host.appendChild(e);setTimeout(()=>e.remove(),5200)}}
$('#homeBtn').addEventListener('click',()=>{sfx.tap();goHome()});
$('#againBtn').addEventListener('click',()=>{sfx.tap();startLevel(finish.i)});
$('#nextLvBtn').addEventListener('click',()=>{sfx.tap();renderHome();show('home');brief(finish.i+1)});

renderHome();
})();
</script>

</body></html>
